{% extends "base.html" %}
{% block title %}首页 - 智慧宿舍管理系统{% endblock %}
{% block content %}
<div class="row mb-4">
    <!-- 数据卡片 -->
    <div class="col-md-3 col-sm-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-secondary mb-1">总学生数</h6>
                        <h3 class="mb-0">{{ total_students }}</h3>
                    </div>
                    <div class="bg-primary/10 p-3 rounded-circle">
                        <i class="bi bi-people-fill text-primary fs-4"></i>
                    </div>
                </div>
                <div class="mt-3">
                    <span class="text-success"><i class="bi bi-arrow-up"></i> 2.5%</span>
                    <span class="text-secondary ms-1">较上月</span>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3 col-sm-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-secondary mb-1">总宿舍数</h6>
                        <h3 class="mb-0">{{ total_dorms }}</h3>
                    </div>
                    <div class="bg-success/10 p-3 rounded-circle">
                        <i class="bi bi-building-fill text-success fs-4"></i>
                    </div>
                </div>
                <div class="mt-3">
                    <span class="text-success"><i class="bi bi-arrow-up"></i> 1.8%</span>
                    <span class="text-secondary ms-1">较上月</span>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3 col-sm-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-secondary mb-1">床位使用率</h6>
                        <h3 class="mb-0">{{ bed_rate }}</h3>
                    </div>
                    <div class="bg-warning/10 p-3 rounded-circle">
                        <i class="bi bi-percent text-warning fs-4"></i>
                    </div>
                </div>
                <div class="mt-3">
                    <span class="text-danger"><i class="bi bi-arrow-down"></i> 0.5%</span>
                    <span class="text-secondary ms-1">较上月</span>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3 col-sm-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-secondary mb-1">待处理事项</h6>
                        <h3 class="mb-0">{{ pending_tasks or 0 }}</h3>
                    </div>
                    <div class="bg-danger/10 p-3 rounded-circle">
                        <i class="bi bi-bell-fill text-danger fs-4"></i>
                    </div>
                </div>
                <div class="mt-3">
                    <span class="text-success"><i class="bi bi-arrow-down"></i> 3.2%</span>
                    <span class="text-secondary ms-1">较昨日</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 数据图表 -->
<div class="row mb-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">学生入住趋势</h5>
            </div>
            <div class="card-body">
                <div id="occupancyChart" style="width: 100%; height: 300px;"></div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">性别分布</h5>
            </div>
            <div class="card-body">
                <div id="genderChart" style="width: 100%; height: 300px;"></div>
            </div>
        </div>
    </div>
</div>

<!-- 快捷操作 -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">快捷操作</h5>
    </div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-2 col-sm-4">
                <a href="/student/add" class="btn btn-primary w-100 d-flex flex-column align-items-center py-3">
                    <i class="bi bi-person-add fs-3 mb-2"></i>
                    <span>新增学生</span>
                </a>
            </div>
            <div class="col-md-2 col-sm-4">
                <a href="/dormitory/add" class="btn btn-success w-100 d-flex flex-column align-items-center py-3">
                    <i class="bi bi-door-open-fill fs-3 mb-2"></i>
                    <span>新增宿舍</span>
                </a>
            </div>
            <div class="col-md-2 col-sm-4">
                <a href="/student/import" class="btn btn-warning w-100 d-flex flex-column align-items-center py-3">
                    <i class="bi bi-file-excel-fill fs-3 mb-2"></i>
                    <span>批量导入</span>
                </a>
            </div>
            <div class="col-md-2 col-sm-4">
                <a href="/system/backup" class="btn btn-info w-100 d-flex flex-column align-items-center py-3">
                    <i class="bi bi-database-fill fs-3 mb-2"></i>
                    <span>数据备份</span>
                </a>
            </div>
            <div class="col-md-2 col-sm-4">
                <a href="/student/export" class="btn btn-dark w-100 d-flex flex-column align-items-center py-3">
                    <i class="bi bi-file-earmark-excel-fill fs-3 mb-2"></i>
                    <span>批量导出</span>
                </a>
            </div>
            <div class="col-md-2 col-sm-4">
                <a href="/dormitory/occupancy" class="btn btn-secondary w-100 d-flex flex-column align-items-center py-3">
                    <i class="bi bi-arrow-left-right fs-3 mb-2"></i>
                    <span>入住管理</span>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- 引入图表库 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
// 初始化图表
document.addEventListener('DOMContentLoaded', function() {
    // 入住趋势图
    const occupancyChart = echarts.init(document.getElementById('occupancyChart'));
    occupancyChart.setOption({
        title: { text: '' },
        tooltip: { trigger: 'axis' },
        legend: { data: ['男生', '女生'] },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: {
            type: 'category',
            data: ['1月', '2月', '3月', '4月', '5月', '6月']
        },
        yAxis: { type: 'value' },
        series: [
            { name: '男生', type: 'line', data: [120, 132, 101, 134, 90, 230] },
            { name: '女生', type: 'line', data: [220, 182, 191, 234, 290, 330] }
        ],
        color: ['#165DFF', '#F53F3F']
    });

    // 性别分布图
    const genderChart = echarts.init(document.getElementById('genderChart'));
    genderChart.setOption({
        title: { text: '' },
        tooltip: { trigger: 'item' },
        series: [
            {
                name: '性别分布',
                type: 'pie',
                radius: ['40%', '70%'],
                data: [
                    { value: {{ male_count or 0 }}, name: '男生' },
                    { value: {{ female_count or 0 }}, name: '女生' }
                ],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }
        ],
        color: ['#165DFF', '#F53F3F']
    });

    // 响应式调整
    window.addEventListener('resize', function() {
        occupancyChart.resize();
        genderChart.resize();
    });
});
</script>
{% endblock %}
