{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">新增费用</h4>
    </div>
    <div class="card-body">
        <form method="POST" action="/fee/add">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">费用类型</label>
                <select name="fee_type" class="form-select" required>
                    <option value="rent">住宿费</option>
                    <option value="water">水费</option>
                    <option value="electricity">电费</option>
                    <option value="network">网费</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">楼栋</label>
                <select name="building_no" class="form-select">
                    {% for b in buildings %}
                    <option value="{{ b.building_no }}">{{ b.building_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">宿舍号</label>
                <input type="text" name="dormitory_no" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">金额</label>
                <input type="number" name="amount" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
                <label class="form-label">月份</label>
                <input type="text" name="month" class="form-control" placeholder="2024-01" required>
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
        </form>
    </div>
</div>
{% endblock %}
