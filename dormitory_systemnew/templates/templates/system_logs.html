{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0">操作日志</h4>
        <a href="/system/logs" class="btn btn-sm btn-secondary">刷新</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr><th>时间</th><th>日志内容</th></tr>
                </thead>
                <tbody>
                    {% for line in logs %}
                    <tr><td class="text-nowrap">{{ line[:19] }}</td><td>{{ line[20:] }}</td></tr>
                    {% else %}
                    <tr><td colspan="2" class="text-center">暂无日志</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
