{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header"><h4>新增学生</h4></div>
    <div class="card-body">
        {% if error_msg %}<div class="alert alert-danger">{{ error_msg|safe }}</div>{% endif %}
        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label>照片</label>
                <input type="file" class="form-control" name="photo" accept="image/*">
            </div>
            <div class="mb-3">
                <label>学号 <span class="text-danger"></span></label>
                <input type="text" class="form-control" name="student_no" value="{{ student.student_no if student else '' }}" required>
                <div class="invalid-feedback" style="display: none;">学号必须是11位数字！</div>
            </div>
            <div class="mb-3">
                <label>姓名</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label>性别</label>
                <select class="form-select" name="gender" required>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <div class="mb-3">
                <label>年龄</label>
                <input type="number" class="form-control" name="age">
            </div>
            <div class="mb-3">
                <label>宿舍号 <span class="text-danger"></span></label>
                <select class="form-select" name="dormitory_no">
                    <option value="">未分配</option>
                    {% for dorm_no in dormitories %}
                    <option value="{{ dorm_no }}">{{ dorm_no }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label>联系电话</label>
                <input type="text" class="form-control" name="phone">
                <div class="invalid-feedback" style="display: none;">联系电话必须是11位数字！</div>
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    const studentNoInput = document.querySelector('input[name="student_no"]');
    const phoneInput = document.querySelector('input[name="phone"]');
    const studentNoFeedback = studentNoInput.parentNode.querySelector('.invalid-feedback');
    const phoneFeedback = phoneInput.parentNode.querySelector('.invalid-feedback');

    // 显示提示消息
    function showMessage(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show`;
        alertDiv.role = 'alert';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        const container = document.querySelector('.card-body');
        container.insertBefore(alertDiv, container.firstChild);
        
        // 3 秒后自动消失
        setTimeout(() => {
            alertDiv.remove();
        }, 3000);
    }

    // 验证输入
    function validateInput(input, regex, feedbackElement) {
        const value = input.value.trim();
        const isValid = regex.test(value);
        if (!isValid && value !== '') {
            input.classList.add('is-invalid');
            feedbackElement.style.display = 'block';
        } else {
            input.classList.remove('is-invalid');
            feedbackElement.style.display = 'none';
        }
        return isValid || value === '';
    }

    function validateStudentNo() {
        return validateInput(studentNoInput, /^[0-9]{11}$/, studentNoFeedback);
    }

    function validatePhone() {
        if (phoneInput.value.trim() === '') {
            phoneInput.classList.remove('is-invalid');
            phoneFeedback.style.display = 'none';
            return true;
        }
        return validateInput(phoneInput, /^[0-9]{11}$/, phoneFeedback);
    }

    studentNoInput.addEventListener('input', validateStudentNo);
    phoneInput.addEventListener('input', validatePhone);

    // 使用 AJAX 提交表单
    form.addEventListener('submit', function(event) {
        event.preventDefault(); // 阻止默认提交
        
        const isStudentNoValid = validateStudentNo();
        const isPhoneValid = validatePhone();
        
        if (!isStudentNoValid || !isPhoneValid) {
            return;
        }
        
        const formData = new FormData(form);
        
        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showMessage(data.message || '添加成功', 'success');
                // 清空表单
                form.reset();
                // 1 秒后跳转到学生列表
                setTimeout(() => {
                    window.location.href = '/students';
                }, 1000);
            } else {
                showMessage(data.message || '添加失败', 'danger');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showMessage('网络错误，请重试', 'danger');
        });
    });
});
</script>
{% endblock %}
