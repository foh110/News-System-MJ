{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">费用管理</h4>
    </div>
    <div class="card-body">
        {% if fees %}
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr><th>费用类型</th><th>楼栋</th><th>宿舍</th><th>金额</th><th>月份</th><th>状态</th></tr>
            </thead>
            <tbody>
                {% for f in fees %}
                <tr>
                    <td>{{ f.fee_type }}</td>
                    <td>{{ f.building_no }}</td>
                    <td>{{ f.dormitory_no }}</td>
                    <td>{{ f.amount }}</td>
                    <td>{{ f.month }}</td>
                    <td>{{ f.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="alert alert-warning">暂无费用数据</div>
        {% endif %}
    </div>
</div>
{% endblock %}
