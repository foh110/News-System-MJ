{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">用户管理</h4>
    </div>
    <div class="card-body">
        {% if users %}
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr><th>用户名</th><th>真实姓名</th><th>角色</th><th>电话</th><th>状态</th></tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.username }}</td>
                    <td>{{ u.real_name or '-' }}</td>
                    <td>{{ u.role }}</td>
                    <td>{{ u.phone or '-' }}</td>
                    <td>{{ '启用' if u.status else '禁用' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="alert alert-warning">暂无用户数据</div>
        {% endif %}
    </div>
</div>
{% endblock %}
