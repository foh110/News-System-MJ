{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">系统日志</h4>
    </div>
    <div class="card-body">
        {% if logs %}
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr><th>时间</th><th>用户</th><th>操作</th><th>模块</th><th>IP地址</th></tr>
            </thead>
            <tbody>
                {% for l in logs %}
                <tr>
                    <td>{{ l.created_at }}</td>
                    <td>{{ l.username or '-' }}</td>
                    <td>{{ l.action }}</td>
                    <td>{{ l.module or '-' }}</td>
                    <td>{{ l.ip_address or '-' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="alert alert-warning">暂无日志数据</div>
        {% endif %}
    </div>
</div>
{% endblock %}
