{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">新增楼栋</h4>
    </div>
    <div class="card-body">
        <form method="POST" action="/building/add">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">楼栋编号</label>
                <input type="text" name="building_no" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">楼栋名称</label>
                <input type="text" name="building_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">楼栋类型</label>
                <select name="building_type" class="form-select">
                    <option value="male">男生楼</option>
                    <option value="female">女生楼</option>
                    <option value="mixed">混合楼</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">楼层数</label>
                <input type="number" name="floors" class="form-control" value="6">
            </div>
            <div class="mb-3">
                <label class="form-label">管理员姓名</label>
                <input type="text" name="manager_name" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">管理员电话</label>
                <input type="text" name="manager_phone" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
        </form>
    </div>
</div>
{% endblock %}
