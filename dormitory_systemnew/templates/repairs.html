{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">报修管理</h4>
    </div>
    <div class="card-body">
        {% if repairs %}
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr><th>报修单号</th><th>楼栋</th><th>宿舍</th><th>报修人</th><th>类型</th><th>状态</th></tr>
            </thead>
            <tbody>
                {% for r in repairs %}
                <tr>
                    <td>{{ r.repair_no }}</td>
                    <td>{{ r.building_no }}</td>
                    <td>{{ r.dormitory_no }}</td>
                    <td>{{ r.student_name or '-' }}</td>
                    <td>{{ r.repair_type }}</td>
                    <td>{{ r.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="alert alert-warning">暂无报修数据</div>
        {% endif %}
    </div>
</div>
{% endblock %}
